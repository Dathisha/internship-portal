<section class="statistics-section" #statsSection>
  <div class="section-container">
    <div class="section-heading">
      <p class="eyebrow">Our Impact</p>
      <h2>Trusted by thousands of students</h2>
    </div>

    <div class="stats-grid">
      <div *ngFor="let stat of statistics" class="stat-card">
        <div class="stat-icon">{{ stat.icon }}</div>
        <div class="stat-value">{{ stat.displayValue }}+</div>
        <div class="stat-label">{{ stat.label }}</div>
      </div>
    </div>
  </div>
</section>
