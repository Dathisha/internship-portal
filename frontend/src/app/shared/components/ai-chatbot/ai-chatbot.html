<div class="chatbot-container" [class.open]="isOpen">
  <div class="chat-box" *ngIf="isOpen">
    <div class="chat-header">
      <h3>Intern 2 Expert Assistant</h3>
      <button class="close-btn" (click)="closeChat()" aria-label="Close chatbot">×</button>
    </div>

    <div class="chat-messages" #chatMessages>
      <div *ngFor="let message of messages" class="message" [ngClass]="{'user': message.sender === 'user', 'bot': message.sender === 'bot'}">
        <div class="message-bubble">
          <p>{{ message.text }}</p>
        </div>
      </div>
      <div *ngIf="isLoading" class="message bot">
        <div class="message-bubble typing">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </div>

    <div class="chat-input">
      <input
        type="text"
        [(ngModel)]="userInput"
        (keyup.enter)="sendMessage()"
        placeholder="Ask about programs, fees, apply..."
        aria-label="Chat message input"
        autocomplete="off"
      />
      <button (click)="sendMessage()" [disabled]="!userInput.trim() || isLoading" aria-label="Send message">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>

  <button *ngIf="!isOpen" class="chatbot-toggle" (click)="toggleChat()" aria-label="Open AI chatbot" title="Chat with our AI Assistant">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
    </svg>
  </button>
</div>
