<header class="site-header">
  <nav class="nav-shell" aria-label="Primary navigation">
    <a class="brand" routerLink="/" (click)="closeMenu()">
      <div class="brand-badge">
        <img src="assets/logo.png" alt="Crescent Technosoft logo" class="brand-logo" />
      </div>
      <span class="brand-text">
        <strong>INTERN 2 EXPERT</strong>
        <small>UNIT OF CRESCENT TECHNOSOFT</small>
      </span>
    </a>

    <button class="menu-toggle" type="button" (click)="toggleMenu()" aria-label="Open navigation menu">
      ☰
    </button>

    <div class="nav-links" [class.open]="isMenuOpen">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeMenu()">Home</a>
      <a routerLink="/internship-programs" routerLinkActive="active" (click)="closeMenu()">Programs</a>
      <a routerLink="/apply" routerLinkActive="active" (click)="closeMenu()">Apply Now</a>
      <a routerLink="/certificate-generator" routerLinkActive="active" (click)="closeMenu()" class="nav-cert-link">AI
        Certificate Generator</a>
      <a routerLink="/contact" routerLinkActive="active" (click)="closeMenu()">Contact</a>

    </div>
  </nav>
</header>
