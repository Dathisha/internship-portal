<section class="programs-section">
  <div class="section-container">
    <div class="section-heading">
      <p class="eyebrow">Our Programs</p>
      <h2>Choose Your Learning Path</h2>
      <p class="subtitle">We offer two comprehensive programs tailored to your career goals</p>
    </div>

    <div class="programs-grid">
      <div *ngFor="let program of programs; let index = index" class="program-card">
        <div class="program-badge">{{ index === 0 ? 'POPULAR' : 'COMPREHENSIVE' }}</div>
        <h3>{{ program.title }}</h3>
        <p class="program-description">{{ program.description }}</p>

        <div class="features-list">
          <div class="features-row" *ngFor="let row of program.features | slice: 0:(program.features.length > 5 ? Math.ceil(program.features.length / 2) : program.features.length)">
            <div class="feature">
              <span class="feature-icon">{{ row.icon }}</span>
              <span class="feature-title">{{ row.title }}</span>
            </div>
          </div>
          <div class="features-row" *ngIf="program.features.length > 5">
            <div class="feature" *ngFor="let feature of program.features | slice: Math.ceil(program.features.length / 2)">
              <span class="feature-icon">{{ feature.icon }}</span>
              <span class="feature-title">{{ feature.title }}</span>
            </div>
          </div>
        </div>

        <button class="program-btn" routerLink="/apply">{{ program.buttonText }}</button>
      </div>
    </div>
  </div>
</section>
